name: Lint Pull Request Title

description: A composite action for linting pull request titles.

inputs:
  token:
    description: The GitHub token used to read the pull request.
    default: ${{ github.token }}
    required: false

runs:
  using: composite
  steps:
    - name: Lint Pull Request Title
      uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
      with:
        requireScope: false
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
